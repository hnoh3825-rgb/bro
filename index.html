<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reels Studio — أداة تحويل الفيديو الشخصية</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ======= Header ======= -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>Reels Studio</h1>
    </div>
    <div class="topbar-status" id="apiStatus">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">جاهز</span>
    </div>
  </header>

  <main class="layout">

    <!-- ======= Left: Input Panel ======= -->
    <section class="panel input-panel">
      <h2 class="panel-title">1. أدخل الفيديو</h2>

      <div id="dropzone" class="dropzone">
        <input type="file" id="fileInput" accept="video/mp4,video/quicktime" hidden>
        <div class="dropzone-icon">＋</div>
        <p class="dropzone-text">اسحب وأفلت الفيديو هنا</p>
        <p class="dropzone-sub">أو اضغط للاختيار (MP4 / MOV)</p>
      </div>

      <div class="divider"><span>أو</span></div>

      <div class="url-input-row">
        <input type="text" id="urlInput" placeholder="رابط فيديو MP4 مباشر (لا يدعم يوتيوب)">
        <button id="urlLoadBtn" class="btn btn-secondary">تحميل</button>
      </div>

      <div id="fileInfo" class="file-info hidden">
        <video id="previewVideo" controls></video>
        <p id="fileName" class="file-name"></p>
      </div>

      <button id="analyzeBtn" class="btn btn-primary" disabled>
        <span id="analyzeBtnText">تحليل واختيار أفضل اللحظات</span>
      </button>

      <div id="progressBox" class="progress-box hidden">
        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <p id="progressLabel" class="progress-label">جاري التحضير...</p>
      </div>
    </section>

    <!-- ======= Right: Dashboard ======= -->
    <section class="panel dashboard-panel">
      <h2 class="panel-title">2. المقاطع المُولّدة</h2>
      <div id="clipsGrid" class="clips-grid">
        <p class="empty-state" id="emptyState">لا توجد مقاطع بعد — ارفع فيديو وابدأ التحليل.</p>
      </div>
    </section>

  </main>
</div>

<!-- ======= Editor Modal ======= -->
<div id="editorModal" class="modal hidden">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">✕</button>
    <h3 id="editorTitle">تعديل المقطع</h3>

    <video id="editorVideo" controls></video>

    <div class="editor-controls">
      <label>وقت البداية (ثانية)
        <input type="number" id="editStart" step="0.1">
      </label>
      <label>وقت النهاية (ثانية)
        <input type="number" id="editEnd" step="0.1">
      </label>
    </div>

    <div class="editor-transcript">
      <label>نص الترجمة (يمكنك تعديل الأخطاء الإملائية)</label>
      <textarea id="editTranscript" rows="4"></textarea>
    </div>

    <div class="editor-actions">
      <button id="rerenderBtn" class="btn btn-primary">إعادة القص والمعالجة</button>
      <button id="downloadClipBtn" class="btn btn-secondary">تحميل المقطع</button>
    </div>
    <p id="editorStatus" class="editor-status"></p>
  </div>
</div>

<!-- FFmpeg.wasm (client-side video processing) -->
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
